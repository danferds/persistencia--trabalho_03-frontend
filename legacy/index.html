<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobilidade Urbana — Painel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar bg-body-tertiary border-end">
      <div class="sidebar-brand">
        <span class="brand-logo">◈</span>
        <span class="sidebar-brand__text">Mobilidade<strong>Urbana</strong></span>
      </div>

      <nav class="nav nav-pills flex-column gap-1 px-3" id="nav"></nav>

      <div class="sidebar-foot border-top p-3">
        <div class="d-flex align-items-center gap-2 small text-body-secondary mb-2" id="apiStatus">
          <span class="status-dot" id="apiDot"></span>
          <span id="apiLabel" class="text-truncate">verificando…</span>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary flex-fill" id="settingsBtn" title="Configurar URL da API">
            <i class="bi bi-gear me-1"></i> API
          </button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div id="view" class="container-fluid py-4 px-3 px-lg-5"></div>
    </main>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
